<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Assistant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f0f;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0, 191, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 127, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 150, 200, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='%23333'%3e%3cpath d='m0 2 l30 30 m0 -30 l-30 30'/%3e%3c/svg%3e") repeat;
            opacity: 0.03;
            pointer-events: none;
        }
        
        .container {
            background: rgba(16, 24, 24, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(0, 191, 255, 0.2);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 650px;
            width: 100%;
            position: relative;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                transparent,
                rgba(0, 191, 255, 0.4) 50%,
                transparent
            );
            border-radius: 16px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite alternate;
        }
        
        @keyframes borderGlow {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }
        
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, #00bfff, #00ff7f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
        }
        
        .subtitle {
            color: #8892b0;
            margin-bottom: 35px;
            font-size: 15px;
            font-weight: 400;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0.8;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #00ffff;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        textarea, input[type="file"] {
            width: 100%;
            padding: 16px;
            background: rgba(10, 25, 47, 0.8);
            border: 1px solid rgba(65, 105, 225, 0.4);
            border-radius: 8px;
            font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
            color: #ccd6f6;
            resize: vertical;
            min-height: 150px;
            transition: all 0.3s ease;
        }
        
        textarea::placeholder {
            color: #495670;
            font-style: italic;
        }
        
        textarea:focus, input[type="file"]:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 
                0 0 0 3px rgba(0, 255, 255, 0.1),
                0 4px 20px rgba(0, 255, 255, 0.2);
            background: rgba(10, 25, 47, 1);
        }
        
        input[type="file"] {
            min-height: auto;
            padding: 12px 16px;
            cursor: pointer;
            background: rgba(16, 16, 24, 0.9);
        }
        
        input[type="file"]::-webkit-file-upload-button {
            background: linear-gradient(135deg, #191970, #00ff7f);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            margin-right: 10px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #191970 0%, #00ff7f 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 30px rgba(25, 25, 112, 0.6),
                0 0 20px rgba(0, 255, 127, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            border-left: 4px solid;
        }
        
        .message.success {
            background: rgba(65, 105, 225, 0.1);
            color: #4169e1;
            border-left-color: #4169e1;
        }
        
        .message.error {
            background: rgba(255, 69, 0, 0.1);
            color: #ff6b35;
            border-left-color: #ff6b35;
        }
        
        .message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        .results-display {
            margin-top: 25px;
            padding: 25px;
            background: rgba(10, 25, 47, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(65, 105, 225, 0.4);
            backdrop-filter: blur(10px);
        }
        
        .results-display.show {
            display: block !important;
            animation: fadeInUp 0.5s ease;
        }
        
        .job-count h3 {
            color: #00ff7f;
            margin-bottom: 10px;
            font-size: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }
        
        .job-count p {
            color: #ccd6f6;
            font-size: 18px;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 20px;
        }
        
        .top-jobs h4 {
            color: #4169e1;
            margin-bottom: 12px;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .top-jobs ul {
            list-style: none;
            margin-bottom: 20px;
        }
        
        .top-jobs li {
            color: #8892b0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(65, 105, 225, 0.2);
        }
        
        .top-jobs li:last-child {
            border-bottom: none;
        }
        
        .top-jobs .job-title {
            color: #ccd6f6;
            font-weight: 500;
        }
        
        .top-jobs .job-company {
            color: #4169e1;
            margin-left: 10px;
        }
        
        .top-jobs .job-score {
            color: #00ff7f;
            float: right;
            font-weight: 600;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .action-btn {
            flex: 1;
            padding: 12px;
            background: rgba(25, 25, 112, 0.8);
            color: #ccd6f6;
            border: 1px solid rgba(65, 105, 225, 0.4);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            background: rgba(65, 105, 225, 0.8);
            border-color: #4169e1;
            transform: translateY(-2px);
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .response-box {
            margin-top: 25px;
            padding: 25px;
            background: rgba(10, 25, 47, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(65, 105, 225, 0.4);
            display: none;
            backdrop-filter: blur(10px);
        }
        
        .response-box.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .response-box h3 {
            color: #4169e1;
            margin-bottom: 15px;
            font-size: 18px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .response-content {
            color: #ccd6f6;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            border-left: 3px solid #191970;
        }
        
        .prompt-preview {
            background: rgba(16, 16, 24, 0.9);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #8892b0;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid rgba(25, 25, 112, 0.4);
        }
        
        .prompt-preview strong {
            color: #00ff7f;
            font-weight: 600;
        }
        
        /* Terminal-style scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(16, 16, 24, 0.5);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(65, 105, 225, 0.4);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(65, 105, 225, 0.6);
        }
        
        /* Tech glow effects */
        .tech-accent {
            color: #4169e1;
            text-shadow: 0 0 10px rgba(65, 105, 225, 0.5);
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 25px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            textarea, input[type="file"] {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Job Assistant</h1>
        <p class="subtitle">> Neural job matching system initialized</p>
        
        <form id="textForm" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="jobPosition">// TARGET_POSITIONS:</label>
                <textarea 
                    id="jobPosition" 
                    name="job_position" 
                    placeholder="Software Engineer, Backend Developer, DevOps Engineer..."
                    required
                    style="min-height: 80px;"
                ></textarea>
            </div>
            
            <div class="form-group">
                <label for="jobKeywords">// SKILL_FILTERS (OPTIONAL):</label>
                <textarea 
                    id="jobKeywords" 
                    name="job_keywords" 
                    placeholder="(Optional) Python, Kubernetes, React, Machine Learning, Docker..."
                    style="min-height: 80px;"
                ></textarea>
            </div>
            
            <div class="form-group">
                <label for="resumeUpload">// RESUME_DATA:</label>
                <input 
                    type="file" 
                    id="resumeUpload" 
                    name="resume" 
                    accept=".pdf,.doc,.docx,.txt"
                    required
                    style="width: 100%; padding: 12px; border: 2px solid #e1e8ed; border-radius: 8px; font-size: 16px;"
                />
            </div>
            
            <button type="submit" id="submitBtn">EXECUTE_ANALYSIS</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div id="resultsDisplay" class="results-display" style="display: none;">
            <div class="job-count">
                <h3>// JOB_ANALYSIS_COMPLETE:</h3>
                <p id="jobCount">0 jobs analyzed</p>
            </div>
            <div class="top-jobs">
                <h4>// TOP_MATCHES:</h4>
                <ul id="topJobsList"></ul>
            </div>
            <div class="actions">
                <button id="viewSpreadsheetBtn" class="action-btn">VIEW_SPREADSHEET</button>
                <button id="viewTraceBtn" class="action-btn">VIEW_TRACE_LOG</button>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('textForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        const responseBox = document.getElementById('responseBox');
        const responseContent = document.getElementById('responseContent');
        const promptPreview = document.getElementById('promptPreview');
        
        // Status messages to cycle through
        const statusMessages = [
            'PARSING_RESUME_DATA...',
            'CONNECTING_TO_JOB_APIS...',
            'EXTRACTION_AGENT_RUNNING...',
            'RANKING_ALGORITHM_ACTIVE...',
            'NEURAL_ANALYSIS_PROCESSING...',
            'SKILLS_MATRIX_BUILDING...',
            'EXPORTING_TO_DATASHEET...',
            'OPTIMIZATION_COMPLETE...'
        ];
        
        let currentStatusIndex = 0;
        let statusInterval;
        
        function cycleStatusMessages() {
            submitBtn.textContent = statusMessages[currentStatusIndex];
            currentStatusIndex = (currentStatusIndex + 1) % statusMessages.length;
        }
        
        const resultsDisplay = document.getElementById('resultsDisplay');
        const jobCount = document.getElementById('jobCount');
        const topJobsList = document.getElementById('topJobsList');
        const viewSpreadsheetBtn = document.getElementById('viewSpreadsheetBtn');
        const viewTraceBtn = document.getElementById('viewTraceBtn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const jobPosition = document.getElementById('jobPosition').value.trim();
            const jobKeywords = document.getElementById('jobKeywords').value.trim();
            const resumeFile = document.getElementById('resumeUpload').files[0];
            
            if (!jobPosition || !resumeFile) {
                showMessage('ERROR: Missing required input parameters (position and resume)', 'error', false);
                return;
            }
            
            submitBtn.disabled = true;
            currentStatusIndex = 0;
            
            // Start cycling through status messages
            submitBtn.textContent = statusMessages[0];
            statusInterval = setInterval(cycleStatusMessages, 2000); // Change every 2 seconds
            
            resultsDisplay.classList.remove('show');
            
            try {
                const formData = new FormData(form);
                
                const response = await fetch('/submit/', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Clear the status interval
                clearInterval(statusInterval);
                
                if (data.status === 'success') {
                    // Display job count and top jobs
                    jobCount.textContent = `${data.job_count || 0} jobs analyzed`;
                    
                    // Clear and populate top jobs list
                    topJobsList.innerHTML = '';
                    if (data.top_jobs && data.top_jobs.length > 0) {
                        data.top_jobs.slice(0, 5).forEach((job, index) => {
                            const li = document.createElement('li');
                            li.innerHTML = `
                                <span class="job-title">${index + 1}. ${job.title}</span>
                                <span class="job-company">@ ${job.company}</span>
                                <span class="job-score">${job.score}/10</span>
                            `;
                            topJobsList.appendChild(li);
                        });
                    } else {
                        const li = document.createElement('li');
                        li.textContent = 'No jobs found';
                        topJobsList.appendChild(li);
                    }
                    
                    resultsDisplay.classList.add('show');
                    showMessage('ANALYSIS_COMPLETE: Spreadsheet generated successfully', 'success', false);
                    submitBtn.textContent = 'ANALYSIS_COMPLETE';
                    
                    // Store spreadsheet path for download
                    if (data.spreadsheet_path) {
                        viewSpreadsheetBtn.onclick = () => {
                            window.open(data.spreadsheet_path, '_blank');
                        };
                    }
                } else {
                    showMessage(`ERROR: ${data.message || 'System malfunction detected'}`, 'error', false);
                    if (data.hint) {
                        showMessage(`ERROR: ${data.message}\nHINT: ${data.hint}`, 'error', false);
                    }
                    submitBtn.textContent = 'EXECUTE_ANALYSIS';
                }
            } catch (error) {
                clearInterval(statusInterval);
                showMessage('NETWORK_ERROR: Connection failed. Retry protocol initiated.', 'error', false);
                submitBtn.textContent = 'EXECUTE_ANALYSIS';
            } finally {
                submitBtn.disabled = false;
            }
        });
        
        // Add trace button functionality
        viewTraceBtn.addEventListener('click', () => {
            window.open('/trace/', '_blank');
        });
        
        function showMessage(text, type, autoHide = false) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} show`;
            
            if (autoHide) {
                setTimeout(() => {
                    messageDiv.classList.remove('show');
                }, 5000);
            }
            // If autoHide is false, message stays visible until manually cleared
        }
    </script>
</body>
</html>
