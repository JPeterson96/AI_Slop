<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Assistant - Trace Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f0f;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0, 191, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 127, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 150, 200, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            color: #ccd6f6;
            line-height: 1.6;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='%23333'%3e%3cpath d='m0 2 l30 30 m0 -30 l-30 30'/%3e%3c/svg%3e") repeat;
            opacity: 0.03;
            pointer-events: none;
        }
        
        .trace-container {
            background: rgba(16, 24, 24, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(0, 191, 255, 0.2);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 1200px;
            width: 100%;
            position: relative;
        }
        
        .trace-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                transparent,
                rgba(0, 191, 255, 0.4) 50%,
                transparent
            );
            border-radius: 16px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite alternate;
        }
        
        @keyframes borderGlow {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .header h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, #00bfff, #00ff7f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
        }
        
        .header .subtitle {
            color: #8892b0;
            margin-bottom: 25px;
            font-size: 15px;
            font-weight: 400;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0.8;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #191970 0%, #00ff7f 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .refresh-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .refresh-btn:hover::before {
            left: 100%;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 30px rgba(25, 25, 112, 0.6),
                0 0 20px rgba(0, 255, 127, 0.3);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: rgba(65, 105, 225, 0.1);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #00ff7f;
        }
        
        .stat-label {
            color: #8892b0;
            font-size: 12px;
        }
        
        /* Card Styles */
        .trace-card {
            background: rgba(10, 25, 47, 0.6);
            border: 1px solid rgba(65, 105, 225, 0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .trace-card:hover {
            border-color: rgba(65, 105, 225, 0.5);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .trace-card.success {
            border-left: 4px solid #00ff7f;
        }
        
        .trace-card.error {
            border-left: 4px solid #ff6b35;
        }
        
        .card-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: rgba(10, 25, 47, 0.8);
        }
        
        .card-header:hover {
            background: rgba(65, 105, 225, 0.1);
        }
        
        .card-title {
            display: flex;
            flex-direction: column;
        }
        
        .agent-name {
            font-weight: 700;
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        .timestamp {
            font-size: 12px;
            color: #8892b0;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .card-meta {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-success {
            background: rgba(0, 255, 127, 0.1);
            color: #00ff7f;
        }
        
        .status-error {
            background: rgba(255, 107, 53, 0.1);
            color: #ff6b35;
        }
        
        .expand-icon {
            color: #00bfff;
            transition: transform 0.3s ease;
        }
        
        .trace-card.expanded .expand-icon {
            transform: rotate(180deg);
        }
        
        .card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .trace-card.expanded .card-body {
            max-height: 2000px; /* Large enough to fit content */
            border-top: 1px solid rgba(65, 105, 225, 0.1);
        }
        
        .card-content {
            padding: 20px;
        }
        
        .detail-row {
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px;
        }
        
        .detail-label {
            color: #8892b0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .detail-value {
            color: #ccd6f6;
            font-size: 14px;
        }
        
        .code-block {
            background: #011627;
            padding: 15px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #d6deeb;
            overflow-x: auto;
            white-space: pre-wrap;
            border: 1px solid rgba(65, 105, 225, 0.1);
            margin-top: 5px;
            max-height: 150px;
            overflow-y: hidden;
            position: relative;
            transition: max-height 0.3s ease;
        }
        
        .code-block.expanded {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .code-container {
            position: relative;
            margin-top: 5px;
        }
        
        .show-more-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background: rgba(65, 105, 225, 0.15);
            border: 1px solid rgba(65, 105, 225, 0.2);
            border-top: none;
            color: #00bfff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 0 0 6px 6px;
            transition: all 0.2s ease;
        }
        
        .show-more-btn:hover {
            background: rgba(65, 105, 225, 0.25);
            color: #ffffff;
        }

        .prompt-block {
            border-left: 3px solid #4169e1;
        }
        
        .response-block {
            border-left: 3px solid #00ff7f;
        }
        
        .section-title {
            color: #00bfff;
            font-size: 14px;
            font-weight: 600;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
        }
        
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(65, 105, 225, 0.2);
            margin-left: 10px;
        }
        
        .loading {
            text-align: center;
            color: #00bfff;
            font-size: 16px;
            padding: 40px;
        }
        
        .error-message {
            background: rgba(255, 107, 53, 0.1);
            color: #ff6b35;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .trace-container {
                margin: 10px;
                padding: 15px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .detail-row {
                grid-template-columns: 1fr;
                gap: 5px;
            }
            
            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .card-meta {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="trace-container">
        <div class="header">
            <h1>AI Agent Tracer</h1>
            <p class="subtitle">> Real-time workflow monitoring system</p>
            <button class="refresh-btn" onclick="loadTraceData()">🔄 Refresh</button>
            <button class="refresh-btn" onclick="toggleAutoRefresh()">⏰ Auto-Refresh: <span id="autoStatus">ON</span></button>
        </div>
        
        <div id="statsSection" class="stats" style="display: none;">
            <div class="stat-box">
                <div class="stat-number" id="totalTraces">0</div>
                <div class="stat-label">Total Traces</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="avgTime">0ms</div>
                <div class="stat-label">Avg Execution Time</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="successRate">0%</div>
                <div class="stat-label">Success Rate</div>
            </div>
        </div>
        
        <div id="traceData" class="loading">Loading trace data...</div>
    </div>
    
    <script>
        let autoRefreshEnabled = true;
        let refreshInterval;
        
        async function loadTraceData() {
            try {
                const response = await fetch('/trace/api/');
                const data = await response.json();
                
                const traceDiv = document.getElementById('traceData');
                const statsSection = document.getElementById('statsSection');
                
                if (data.error) {
                    traceDiv.innerHTML = `<div class="error-message">Error: ${data.error}</div>`;
                } else {
                    // Update stats
                    if (data.metrics) {
                        document.getElementById('totalTraces').textContent = data.metrics.total_traces || 0;
                        document.getElementById('avgTime').textContent = `${data.metrics.avg_execution_time_ms || 0}ms`;
                        document.getElementById('successRate').textContent = `${data.metrics.success_rate || 0}%`;
                        statsSection.style.display = 'grid';
                    }
                    
                    // Show traces
                    let html = `<h3>Recent Traces (${data.traces ? data.traces.length : 0} entries)</h3><br>`;
                    
                    if (data.traces && data.traces.length > 0) {
                        data.traces.forEach((trace, index) => {
                            const statusClass = trace.status === 'success' || trace.status === true ? 'success' : 'error';
                            const statusText = trace.status === 'success' || trace.status === true ? 'SUCCESS' : 'ERROR';
                            const cardId = `card-${index}`;
                            
                            html += `
                                <div class="trace-card ${statusClass}" id="${cardId}">
                                    <div class="card-header" onclick="toggleCard('${cardId}')">
                                        <div class="card-title">
                                            <div class="agent-name">${trace.agent_name}</div>
                                            <div class="timestamp">${new Date(trace.timestamp).toLocaleString()}</div>
                                        </div>
                                        <div class="card-meta">
                                            <span class="status-badge status-${statusClass}">${statusText}</span>
                                            <span style="color: #8892b0; font-size: 12px;">${trace.execution_time_ms}ms</span>
                                            <div class="expand-icon">▼</div>
                                        </div>
                                    </div>
                                    
                                    <div class="card-body">
                                        <div class="card-content">
                                            <div class="detail-row">
                                                <div class="detail-label">Model Used</div>
                                                <div class="detail-value">${trace.llm_provider}</div>
                                            </div>
                                            
                                            <div class="detail-row">
                                                <div class="detail-label">Session ID</div>
                                                <div class="detail-value">${trace.session_id}</div>
                                            </div>
                                            
                                            ${trace.job_position ? `
                                            <div class="detail-row">
                                                <div class="detail-label">Job Position</div>
                                                <div class="detail-value">${trace.job_position}</div>
                                            </div>` : ''}
                                            
                                            ${trace.error_message ? `
                                            <div class="detail-row">
                                                <div class="detail-label" style="color: #ff6b35;">Error</div>
                                                <div class="detail-value" style="color: #ff6b35;">${trace.error_message}</div>
                                            </div>` : ''}
                                            
                                            <div class="section-title">Prompt</div>
                                            <div class="code-container">
                                                <div class="code-block prompt-block" id="prompt-${index}">${trace.prompt_preview || 'No prompt data available'}</div>
                                                ${(trace.prompt_preview && trace.prompt_preview.length > 300) ? 
                                                    `<button class="show-more-btn" onclick="toggleCode('prompt-${index}', this)">Show Full Prompt (${trace.prompt_preview.length} chars)</button>` : ''}
                                            </div>
                                            
                                            <div class="section-title">Output</div>
                                            <div class="code-container">
                                                <div class="code-block response-block" id="response-${index}">${trace.response_preview || 'No response data available'}</div>
                                                ${(trace.response_preview && trace.response_preview.length > 300) ? 
                                                    `<button class="show-more-btn" onclick="toggleCode('response-${index}', this)">Show Full Output (${trace.response_preview.length} chars)</button>` : ''}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        html += '<div class="trace-card"><div class="card-content" style="text-align: center; color: #8892b0;">No traces found. Execute a job search to see traces here.</div></div>';
                    }
                    
                    // Preserve expanded state if refreshing
                    const expandedCards = document.querySelectorAll('.trace-card.expanded');
                    const expandedIds = Array.from(expandedCards).map(card => card.id);
                    
                    traceDiv.innerHTML = html;
                    
                    // Restore expanded state
                    expandedIds.forEach(id => {
                        const card = document.getElementById(id);
                        if (card) card.classList.add('expanded');
                    });
                }
                
            } catch (error) {
                document.getElementById('traceData').innerHTML = 
                    `<div class="error-message">Failed to load trace data: ${error.message}</div>`;
            }
        }
        
        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            document.getElementById('autoStatus').textContent = autoRefreshEnabled ? 'ON' : 'OFF';
            
            if (autoRefreshEnabled) {
                refreshInterval = setInterval(loadTraceData, 10000); // Refresh every 10 seconds
            } else {
                clearInterval(refreshInterval);
            }
        }
        
        function toggleCard(cardId) {
            const card = document.getElementById(cardId);
            // Only toggle if we didn't click a button or code block
            if (!event.target.closest('.show-more-btn') && !event.target.closest('.code-block')) {
                card.classList.toggle('expanded');
            }
        }
        
        function toggleCode(elementId, btn) {
            event.stopPropagation(); // Prevent card toggle
            const block = document.getElementById(elementId);
            block.classList.toggle('expanded');
            
            if (block.classList.contains('expanded')) {
                btn.textContent = 'Show Less';
            } else {
                const type = elementId.includes('prompt') ? 'Prompt' : 'Output';
                const length = block.textContent.length;
                btn.textContent = `Show Full ${type} (${length} chars)`;
            }
        }
        
        // Initial load
        loadTraceData();
        
        // Start auto-refresh
        refreshInterval = setInterval(loadTraceData, 10000);
    </script>
</body>
</html>
