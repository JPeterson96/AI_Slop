<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Trace Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f0f;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0, 191, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 127, 0.15) 0%, transparent 50%);
            min-height: 100vh;
            color: #ccd6f6;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #00bfff, #00ff7f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #8892b0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(16, 24, 24, 0.95);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(0, 191, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .card h2 {
            font-family: 'JetBrains Mono', monospace;
            color: #00ffff;
            font-size: 18px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .metric {
            background: rgba(10, 25, 47, 0.8);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(65, 105, 225, 0.3);
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: #00ff7f;
            margin-bottom: 5px;
        }
        
        .metric-label {
            font-size: 11px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .trace-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(65, 105, 225, 0.3);
            border-radius: 8px;
        }
        
        .trace-item {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(65, 105, 225, 0.2);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }
        
        .trace-item:last-child {
            border-bottom: none;
        }
        
        .trace-item:hover {
            background: rgba(0, 191, 255, 0.1);
        }
        
        .trace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .agent-name {
            color: #4169e1;
            font-weight: 600;
        }
        
        .timestamp {
            color: #8892b0;
            font-size: 10px;
        }
        
        .execution-time {
            color: #00ff7f;
            font-size: 10px;
        }
        
        .success-badge {
            background: rgba(0, 255, 127, 0.2);
            color: #00ff7f;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
        
        .error-badge {
            background: rgba(255, 69, 0, 0.2);
            color: #ff6b35;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
        
        .prompt-preview {
            color: #ccd6f6;
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.8;
        }
        
        .session-item {
            padding: 15px;
            border: 1px solid rgba(65, 105, 225, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
            background: rgba(10, 25, 47, 0.5);
        }
        
        .session-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .session-id {
            font-family: 'JetBrains Mono', monospace;
            color: #00ffff;
            font-size: 12px;
            font-weight: 500;
        }
        
        .job-position {
            color: #ccd6f6;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .session-stats {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #8892b0;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #8892b0;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .error-message {
            background: rgba(255, 69, 0, 0.1);
            color: #ff6b35;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff6b35;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #191970, #00ff7f);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 127, 0.3);
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(16, 16, 24, 0.5);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(65, 105, 225, 0.4);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(65, 105, 225, 0.6);
        }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>// TRACE_DASHBOARD</h1>
        <p>Real-time AI agent workflow monitoring & analytics</p>
    </div>
    
    <div class="dashboard-grid">
        <!-- Metrics Overview -->
        <div class="card">
            <h2>// System_Metrics</h2>
            <button class="refresh-btn" onclick="refreshData()">REFRESH_DATA</button>
            
            <div class="metrics-grid" id="metricsGrid">
                <div class="metric">
                    <div class="metric-value" id="totalTraces">-</div>
                    <div class="metric-label">Total Traces</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="avgExecutionTime">-</div>
                    <div class="metric-label">Avg Time (ms)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="successRate">-</div>
                    <div class="metric-label">Success Rate</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="activeAgents">-</div>
                    <div class="metric-label">Active Agents</div>
                </div>
            </div>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>
        
        <!-- Recent Traces -->
        <div class="card">
            <h2>// Recent_Traces</h2>
            <div class="trace-list" id="traceList">
                <div class="loading">Loading trace data...</div>
            </div>
        </div>
        
        <!-- Agent Usage -->
        <div class="card">
            <h2>// Agent_Usage</h2>
            <div id="agentUsage">
                <div class="loading">Loading agent statistics...</div>
            </div>
        </div>
        
        <!-- Workflow Sessions -->
        <div class="card">
            <h2>// Recent_Sessions</h2>
            <div id="sessionList">
                <div class="loading">Loading workflow sessions...</div>
            </div>
        </div>
    </div>
    
    <script>
        let refreshInterval;
        
        async function fetchTraceData() {
            try {
                const response = await fetch('/trace/api/');
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    return;
                }
                
                updateMetrics(data.metrics);
                updateTraces(data.traces);
                updateAgentUsage(data.metrics.agents_usage);
                updateSessions(data.sessions);
                hideError();
                
            } catch (error) {
                showError(`Failed to fetch trace data: ${error.message}`);
            }
        }
        
        function updateMetrics(metrics) {
            document.getElementById('totalTraces').textContent = metrics.total_traces;
            document.getElementById('avgExecutionTime').textContent = Math.round(metrics.avg_execution_time_ms);
            document.getElementById('successRate').textContent = `${metrics.success_rate.toFixed(1)}%`;
            document.getElementById('activeAgents').textContent = metrics.agents_usage.length;
        }
        
        function updateTraces(traces) {
            const traceList = document.getElementById('traceList');
            
            if (traces.length === 0) {
                traceList.innerHTML = '<div class="loading">No traces available</div>';
                return;
            }
            
            traceList.innerHTML = traces.map(trace => `
                <div class="trace-item">
                    <div class="trace-header">
                        <span class="agent-name">${trace.agent_name}</span>
                        <div>
                            <span class="execution-time">${trace.execution_time}ms</span>
                            <span class="${trace.success ? 'success-badge' : 'error-badge'}">
                                ${trace.success ? 'SUCCESS' : 'ERROR'}
                            </span>
                        </div>
                    </div>
                    <div class="timestamp">${new Date(trace.timestamp).toLocaleString()}</div>
                    <div class="prompt-preview">${trace.prompt_preview}</div>
                </div>
            `).join('');
        }
        
        function updateAgentUsage(agentUsage) {
            const agentUsageDiv = document.getElementById('agentUsage');
            
            if (agentUsage.length === 0) {
                agentUsageDiv.innerHTML = '<div class="loading">No agent usage data</div>';
                return;
            }
            
            agentUsageDiv.innerHTML = agentUsage.map(agent => `
                <div class="trace-item">
                    <div class="trace-header">
                        <span class="agent-name">${agent.agent_name}</span>
                        <span class="execution-time">${agent.count} executions</span>
                    </div>
                </div>
            `).join('');
        }
        
        function updateSessions(sessions) {
            const sessionList = document.getElementById('sessionList');
            
            if (sessions.length === 0) {
                sessionList.innerHTML = '<div class="loading">No workflow sessions</div>';
                return;
            }
            
            sessionList.innerHTML = sessions.map(session => `
                <div class="session-item">
                    <div class="session-id">${session.session_id}</div>
                    <div class="job-position">${session.job_position}</div>
                    <div class="session-stats">
                        <span>Duration: ${session.duration_ms ? session.duration_ms + 'ms' : 'N/A'}</span>
                        <span>Jobs: ${session.total_jobs}</span>
                        <span>Agents: ${session.agent_count}</span>
                        <span class="${session.success ? 'success-badge' : 'error-badge'}">
                            ${session.success ? 'SUCCESS' : 'FAILED'}
                        </span>
                    </div>
                </div>
            `).join('');
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }
        
        function refreshData() {
            fetchTraceData();
        }
        
        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            fetchTraceData();
            
            // Auto-refresh every 30 seconds
            refreshInterval = setInterval(fetchTraceData, 30000);
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
